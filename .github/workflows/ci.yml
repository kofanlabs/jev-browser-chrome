name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest ruff build
      - run: ruff check .
      - run: pytest -q
      - run: node --check extension/background.js
      - run: node --check extension/snapshot.js
      - run: node --test tests/test_extension_tabs.cjs
      - run: python -m build
