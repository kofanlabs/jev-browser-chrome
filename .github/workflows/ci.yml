name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest ruff build
      - run: ruff check .
      - run: pytest -q
      - run: node --check extension/background.js
      - run: node --check extension/snapshot.js
      - run: node --check jev_ultrafast/snapshot.js
      - run: node --check jev_ultrafast/static/app.js
      - run: node --test tests/test_extension_tabs.cjs tests/test_extension_actions.cjs
      - run: python -m build
